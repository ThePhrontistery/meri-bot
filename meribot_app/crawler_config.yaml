SENSITIVE_KEYS:
  - password
  - api_key
  - token
  - secret
# Ejemplo de configuración para el Crawler de Meri-bot
# Puedes copiar este archivo como crawler_config.yaml en el directorio del módulo crawler

seeds:
  - "https://cca.capgemini.com/web/home"
allowed_domains:
  - "onboarding"
  - "training"
  - "cca"
  - "sdo"
user_agent: "MeriBot/1.0"
delay: 1.0 # segundos entre peticiones
output_dir: "./data/scraped"
log_level: "INFO"
chroma_path: "./chroma_data"
embedding_model: "all-MiniLM-L6-v2"
max_depth: 4
file_types:
  - "html"
  - "pdf"
  - "docx"
  - "xlsx"
max_message_length: 4000
max_conversation_id_length: 100
max_domains_count: 5
dangerous_patterns:
  - "ignore previous"
  - "ignore all previous"
  - "forget previous"
  - "system:"
  - "assistant:"
  - "user:"
  - "### instruction"
  - "### system"
  - "jailbreak"
  - "pretend you are"
  - "act as if"
  - "role:"
  - "<|system|>"
  - "<|assistant|>"
  - "<|user|>"
