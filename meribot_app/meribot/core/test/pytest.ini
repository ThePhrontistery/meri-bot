[tool:pytest]
minversion = 6.0
addopts = 
    -ra 
    -q 
    --strict-markers
    --strict-config
    --tb=short
    -v
testpaths = 
    test/unitarios
    test/integracion
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end integration tests
    asyncio: marks tests as asyncio tests
    api: marks tests as API tests
    db: marks tests as database related
    llm: marks tests as LLM related
    validation: marks tests as validation related
    conversation: marks tests as conversation management related
    plugins: marks tests as plugin system related
    crawler: marks tests as crawler integration related
    web: marks tests as web module integration related
    services: marks tests as services module integration related
    utils: marks tests as utils module integration related
    external: marks tests that require external services
    docker: marks tests that require Docker environment

# Configuración para tests asíncronos
asyncio_mode = auto

# Filtros de warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning