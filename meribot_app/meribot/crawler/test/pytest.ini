[tool:pytest]
# Configuración de pytest para tests unitarios del crawler
minversion = 6.0
addopts = 
    -ra 
    -q
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=5
    -v

# Directorios de test
testpaths = 
    test/unitarios

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers para categorizar tests
markers =
    unit: marks tests as unit tests
    config: marks tests related to configuration functionality
    document: marks tests related to document processing
    scraper: marks tests related to web scraping
    logger: marks tests related to logging functionality
    utilities: marks tests related to utility functions
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that require network access
    file_io: marks tests that involve file I/O operations
    azure: marks tests that interact with Azure services
    chroma: marks tests that interact with ChromaDB
    
# Filtros de warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    
# Variables de entorno para tests
env = 
    TESTING=true
    CRAWLER_LOG_LEVEL=WARNING
    CRAWLER_LOG_FORMAT=STANDARD

# Configuración de coverage (si se usa pytest-cov)
[coverage:run]
source = .
branch = true
omit = 
    test/*
    */__pycache__/*
    */test_*
    setup.py

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov