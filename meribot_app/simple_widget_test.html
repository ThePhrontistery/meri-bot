<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 MeriBot Widget - Prueba Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border-radius: 8px;
        }
        
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        
        .test-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        
        .test-button:hover {
            background: #0056b3;
        }
        
        .response-area {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 MeriBot Widget - Prueba Simple</h1>
            <p>Prueba directa del widget después de la refactorización</p>
        </div>
        
        <div class="test-section">
            <h3>📡 Estado del Servidor</h3>
            <div id="serverStatus" class="status info">🔄 Verificando servidor...</div>
            <button class="test-button" onclick="checkServer()">🔍 Verificar Servidor</button>
        </div>
        
        <div class="test-section">
            <h3>🔗 Test de Endpoints</h3>
            <button class="test-button" onclick="testHealth()">✅ Health</button>
            <button class="test-button" onclick="testDomains()">🏢 Domains</button>
            <button class="test-button" onclick="testQuery()">💬 Query</button>
            <div id="endpointResults" class="response-area" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h3>🤖 Widget MeriBot</h3>
            <div id="widgetStatus" class="status info">Widget listo para cargar</div>
            <button class="test-button" onclick="loadWidget()">🚀 Cargar Widget</button>
            
            <!-- Área donde se cargará el widget -->
            <div id="meribot-widget-container" style="margin-top: 20px; min-height: 400px; border: 2px dashed #ccc; padding: 20px;">
                <p style="text-align: center; color: #666;">El widget MeriBot aparecerá aquí</p>
            </div>
        </div>
        
        <div class="test-section">
            <h3>📝 Log de Actividad</h3>
            <button class="test-button" onclick="clearLog()">🧹 Limpiar</button>
            <div id="activityLog" class="response-area"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        
        function log(message) {
            const logArea = document.getElementById('activityLog');
            const timestamp = new Date().toLocaleTimeString();
            logArea.innerHTML += `[${timestamp}] ${message}<br>`;
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('activityLog').innerHTML = '';
            log('📝 Log limpiado');
        }
        
        async function checkServer() {
            const statusDiv = document.getElementById('serverStatus');
            statusDiv.className = 'status info';
            statusDiv.textContent = '🔄 Verificando servidor...';
            
            try {
                const response = await fetch(`${API_BASE}/chatbot/health`, { timeout: 5000 });
                const data = await response.json();
                
                if (response.ok) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✅ Servidor activo y funcionando';
                    log('✅ Servidor verificado correctamente');
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Error: ${error.message}`;
                log(`❌ Error verificando servidor: ${error.message}`);
            }
        }
        
        async function testHealth() {
            log('🔍 Probando endpoint /health...');
            try {
                const response = await fetch(`${API_BASE}/chatbot/health`);
                const data = await response.json();
                showEndpointResult('Health', response.status, data);
                log(`✅ Health test: ${response.status}`);
            } catch (error) {
                showEndpointResult('Health', 'ERROR', { error: error.message });
                log(`❌ Health test failed: ${error.message}`);
            }
        }
        
        async function testDomains() {
            log('🔍 Probando endpoint /allowed_domains...');
            try {
                const response = await fetch(`${API_BASE}/chatbot/allowed_domains`);
                const data = await response.json();
                showEndpointResult('Domains', response.status, data);
                log(`✅ Domains test: ${response.status}`);
            } catch (error) {
                showEndpointResult('Domains', 'ERROR', { error: error.message });
                log(`❌ Domains test failed: ${error.message}`);
            }
        }
        
        async function testQuery() {
            log('🔍 Probando endpoint /query...');
            try {
                const payload = {
                    query: "Hola, esta es una prueba del sistema",
                    conversation_id: null,
                    domain: "training"
                };
                
                const response = await fetch(`${API_BASE}/chatbot/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                showEndpointResult('Query', response.status, data);
                log(`✅ Query test: ${response.status}`);
            } catch (error) {
                showEndpointResult('Query', 'ERROR', { error: error.message });
                log(`❌ Query test failed: ${error.message}`);
            }
        }
        
        function showEndpointResult(endpoint, status, data) {
            const resultsDiv = document.getElementById('endpointResults');
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML += `
                <strong>${endpoint} - Status: ${status}</strong><br>
                <pre>${JSON.stringify(data, null, 2)}</pre>
                <hr>
            `;
        }
        
        function loadWidget() {
            log('🤖 Cargando widget MeriBot...');
            const statusDiv = document.getElementById('widgetStatus');
            statusDiv.className = 'status info';
            statusDiv.textContent = '🔄 Cargando widget...';
            
            // Crear script tag para cargar el widget
            const script = document.createElement('script');
            script.src = './meribot/web/js/widget-chatbot.js';
            
            script.onload = function() {
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Widget cargado exitosamente';
                log('✅ Widget MeriBot cargado correctamente');
            };
            
            script.onerror = function() {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Error cargando widget';
                log('❌ Error al cargar el widget MeriBot');
            };
            
            document.head.appendChild(script);
        }
        
        // Verificar servidor automáticamente al cargar
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Página de pruebas iniciada');
            setTimeout(checkServer, 1000);
        });
    </script>
</body>
</html>
